name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  lockfiles:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve backend dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Resolve frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Commit dependency lockfiles when missing or stale
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const branch = context.payload.pull_request.head.ref;
            let changed = false;

            for (const path of ['backend/composer.lock', 'frontend/package-lock.json']) {
              const content = fs.readFileSync(path);
              let sha;
              let existing;
              try {
                const response = await github.rest.repos.getContent({ owner, repo, path, ref: branch });
                sha = response.data.sha;
                existing = Buffer.from(response.data.content, 'base64');
              } catch (error) {
                if (error.status !== 404) throw error;
              }

              if (existing && existing.equals(content)) continue;

              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path,
                message: 'Add reproducible dependency lockfile: ' + path,
                content: content.toString('base64'),
                branch,
                sha,
              });
              changed = true;
            }

            if (changed) {
              await github.rest.actions.createWorkflowDispatch({
                owner,
                repo,
                workflow_id: 'ci.yml',
                ref: branch,
              });
            }

  backend:
    needs: lockfiles
    if: ${{ always() && (needs.lockfiles.result == 'success' || needs.lockfiles.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo, pdo_sqlite
          coverage: none
      - name: Install locked backend dependencies
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: Validate Composer configuration
        run: composer validate --strict
      - name: Prepare Laravel environment and writable directories
        run: |
          cp .env.example .env
          mkdir -p bootstrap/cache storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
      - name: Run backend tests
        run: php artisan test

  frontend:
    needs: lockfiles
    if: ${{ always() && (needs.lockfiles.result == 'success' || needs.lockfiles.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install locked frontend dependencies
        run: if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
      - name: Build frontend
        run: npm run build
